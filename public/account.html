<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Account · Nails by Jazz</title>
<meta name="theme-color" content="#D23A6E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23D23A6E'/%3E%3Cpath d='M24 50V26c0-8 4-14 8-14s8 6 8 14v24z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300..600&family=Pinyon+Script&display=swap">
<link rel="stylesheet" href="/css/site.css">
<style>
  .auth-wrap { max-width: 440px; margin-inline: auto; }
  .auth-wrap h1, .acct h1 { font-size: clamp(36px, 5vw, 52px); }
  .auth-card { margin-top: 20px; animation: fadeUp .6s var(--ease) both; }
  .tabs .chip { flex: 1; text-align: center; }
  .acct { display: grid; grid-template-columns: 340px 1fr; gap: 24px; align-items: start; margin-top: 24px; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, var(--pink), var(--rose)); color: #fff; display: grid; place-items: center; font-family: var(--display); font-size: 28px; }
  .orders { display: grid; gap: 14px; }
  .order { animation: fadeUp .5s var(--ease) both; }
  .order-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  .order-items { margin-top: 10px; display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
  .order-foot { display: flex; justify-content: space-between; margin-top: 10px; font-weight: 600; font-variant-numeric: tabular-nums; }
  @media (max-width: 860px) { .acct { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Nails by Jazz home"><small>Nails by</small><b>Jazz</b></a>
    <nav class="nav" aria-label="Main"><a href="/#shop">Shop</a><a href="/#recreate">Recreate a design</a><a href="/#faq">FAQ</a></nav>
    <div class="head-actions">
      <a class="pill-btn" href="/account" data-icon="user"><span class="lbl" data-account-label>Log in</span></a>
      <a class="pill-btn" href="/#cart" aria-label="Open cart" data-icon="bag"><span class="lbl">Cart</span> <span class="cart-count num">0</span></a>
    </div>
  </div>
</header>

<main class="page wrap" id="root">
  <div class="skeleton" style="aspect-ratio:auto;height:280px;max-width:440px;margin-inline:auto"></div>
</main>

<footer>
  <div class="wrap">
    <div class="foot-col"><a class="brand" href="/"><small>Nails by</small><b>Jazz</b></a><span>Handmade press-on nails · Meerut</span></div>
    <div class="foot-col"><h4>Need help?</h4><span>WhatsApp: <a data-wa-link href="https://wa.me/918439411560" target="_blank" rel="noopener" data-wa-number>+91 84394 11560</a></span><span>Instagram: <a data-insta-link href="https://instagram.com/jassmakeover13" target="_blank" rel="noopener" data-insta>@jassmakeover13</a></span></div>
  </div>
</footer>
<script src="/js/common.js"></script>
<script src="/js/nail-art.js"></script>
<script src="/js/account.js"></script>
</body>
</html>
