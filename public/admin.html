<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio Admin · Nails by Jazz</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#D23A6E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23D23A6E'/%3E%3Cpath d='M24 50V26c0-8 4-14 8-14s8 6 8 14v24z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300..600&family=Pinyon+Script&display=swap">
<link rel="stylesheet" href="/css/site.css">
<style>
  body { background: var(--blush); }
  .admin h1 { font-size: clamp(32px, 4.5vw, 46px); }
  .login { max-width: 400px; margin: 40px auto; animation: fadeUp .6s var(--ease) both; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-block: 18px; }
  .stat { background: var(--white); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 16px; animation: fadeUp .5s var(--ease) both; }
  .stat b { font-family: var(--display); font-size: 30px; font-weight: 400; display: block; color: var(--rose); font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--muted); }
  @media (max-width: 700px) { .stats { grid-template-columns: 1fr 1fr; } }
  .tabbar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
  .tabbar .chip { white-space: nowrap; }
  .olist { display: grid; gap: 12px; }
  .ocard { background: var(--white); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; display: grid; grid-template-columns: 1.1fr 1.2fr .9fr; gap: 16px; animation: fadeUp .4s var(--ease) both; }
  .ocard h4 { margin: 0; font-size: 15px; }
  .ocard .fine a { color: var(--rose); }
  .ocard .items { display: grid; gap: 6px; font-size: 14px; }
  .ocard .items small { display: block; color: var(--muted); word-break: break-word; }
  .ocard .ctl { display: grid; gap: 8px; align-content: start; }
  .ocard .ctl label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  .ocard select, .ocard input { padding: 7px 10px; font-size: 14px; }
  @media (max-width: 860px) { .ocard { grid-template-columns: 1fr; } }
  .dlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .dcard { background: var(--white); border: 1.5px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; animation: fadeUp .4s var(--ease) both; }
  .dcard .pic { aspect-ratio: 4 / 3; background: var(--blush); display: grid; place-items: center; overflow: hidden; position: relative; }
  .dcard .pic img { width: 100%; height: 100%; object-fit: cover; }
  .dcard .pic svg { padding: 16px; }
  .dcard .pic .photo-count { background: var(--rose); }
  .dcard .body { padding: 12px 14px; display: grid; gap: 4px; flex: 1; }
  .dcard .row { display: flex; gap: 8px; margin-top: 8px; }
  .hidden-tag { font-size: 11px; background: #F3F0F1; color: #6F6168; border-radius: 999px; padding: 2px 8px; }
  .editor { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .editor .wide { grid-column: 1 / -1; }
  .editor input[type=color] { height: 44px; padding: 4px; }
  .photos { display: flex; flex-wrap: wrap; gap: 10px; }
  .ph { width: 110px; border-radius: 12px; overflow: hidden; border: 1.5px solid var(--line); background: var(--white); animation: fadeUp .3s var(--ease) both; }
  .ph img { width: 110px; height: 110px; object-fit: cover; }
  .ph .tools { display: flex; justify-content: space-between; padding: 4px; }
  .ph .tools button { background: none; border: 0; cursor: pointer; font-size: 14px; padding: 2px 5px; color: var(--muted); border-radius: 6px; }
  .ph .tools button:hover { background: var(--blush); color: var(--rose); }
  .ph.cover { border-color: var(--rose); }
  .ph .cover-lbl { font-size: 10.5px; text-align: center; background: var(--rose); color: #fff; }
  .drop { width: 110px; height: 142px; border: 2px dashed var(--pink); border-radius: 12px; display: grid; place-items: center; text-align: center; font-size: 13px; color: var(--rose); cursor: pointer; background: var(--white); padding: 8px; transition: background .2s; }
  .drop:hover, .drop.over { background: var(--blush); }
  .tagpick { display: flex; flex-wrap: wrap; gap: 6px; }
  .tagpick label { display: inline-flex; gap: 6px; align-items: center; border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--ink); cursor: pointer; }
  .tagpick label:has(input:checked) { background: var(--rose); border-color: var(--rose); color: #fff; }
  .tagpick input { display: none; }
  .ptable input { width: 110px; padding: 7px 10px; }
  .ptable td, .ptable th { text-align: left; }
  .ptable .changed { border-color: var(--rose); background: var(--blush); }
  .fees { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress span { display: block; height: 100%; background: var(--rose); transition: width .3s; }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/" aria-label="View shop"><small>Nails by</small><b>Jazz</b></a>
    <div class="head-actions"><a class="pill-btn" href="/" target="_blank" rel="noopener">View shop ↗</a><button class="pill-btn" id="logout" type="button" hidden>Log out</button></div>
  </div>
</header>
<main class="page wrap admin" id="root"></main>
<script src="/js/common.js"></script>
<script src="/js/nail-art.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
