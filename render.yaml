# Render Blueprint: free web service + free PostgreSQL database, linked automatically.
databases:
  - name: nailsbyjazz-db
    plan: free
    region: singapore
    databaseName: nailsbyjazz
    user: nailsbyjazz

services:
  - type: web
    name: nailsbyjazz
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nailsbyjazz-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        value: nailsbyjazzy
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: WHATSAPP_NUMBER
        value: "918439411560"
      - key: INSTAGRAM
        value: jassmakeover13
      - key: PAYMENT_MODE
        value: whatsapp
